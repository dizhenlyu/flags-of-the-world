<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Review the gameplay and player journeys for Flags of the World.">
  <title>Flags of the World — Design Review</title>
  <link rel="stylesheet" href="review/journeys.css">
  <script defer src="review/journeys.js"></script>
</head>
<body>
  <main>
    <nav class="project-links" aria-label="Project documents">
      <a href="https://github.com/dizhenlyu/flags-of-the-world">Repository</a>
      <a href="https://github.com/dizhenlyu/flags-of-the-world/blob/main/docs/rules.md">Rules &amp; evidence</a>
      <a href="https://github.com/dizhenlyu/flags-of-the-world/blob/main/docs/superpowers/plans/2026-11-26-flags-of-the-world.md">Implementation plan</a>
      <a href="https://github.com/dizhenlyu/flags-of-the-world/blob/main/docs/deployment.md">Deployment plan</a>
    </nav>
    <h1>Flags of the World</h1>
    <p class="review-note">Gameplay mockups · manual steps · fixed example round</p>
    <div class="journeys" aria-label="Journey to review">
      <button type="button" data-path="first" aria-pressed="true">First challenge</button>
      <button type="button" data-path="timeout" aria-pressed="false">Time runs out</button>
      <button type="button" data-path="interrupt" aria-pressed="false">Switch apps</button>
    </div>
    <section class="game" aria-label="Game screen mockup">
      <header class="game-header">
        <strong>Flags of the World</strong>
        <span id="mode"></span>
      </header>
      <div id="screen"></div>
    </section>
    <div class="preview-controls" aria-label="Mockup controls">
      <label>Screen <select id="step"></select></label>
      <div>
        <button type="button" id="previous">Previous</button>
        <button type="button" id="next">Next screen →</button>
      </div>
    </div>
    <p id="caption" class="review-note" aria-live="polite"></p>
    <footer class="project-footer">
      Independent fan project · <a href="https://github.com/hampusborgos/country-flags/tree/c09927e63705529bbf59ca6684cd9b23225dddad#readme">Flag artwork source</a>
    </footer>
  </main>
</body>
</html>
